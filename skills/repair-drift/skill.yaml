name: repair-drift
version: 0.1.2
status: draft
family: implementation
description: Use when an agent needs to repair Rust product code after an accepted Tianheng law reacts, without weakening that law.
triggers:
  - Tianheng check exits 1 with an enforced violation
  - user asks to repair a reported Tianheng warning or baselined finding
  - agent receives structured Tianheng violation output while changing Rust code
entrypoint: SKILL.md
resources:
  references: references/
compatibility:
  - openai-codex
  - claude
  - cursor
  - gemini
  - generic-llm-agent
